        "We will contact you if we need more info.",
        "We appreciate your time.",
        "We're always seeking top talent.",
        "We're committed to an inclusive workplace."
      ];
      const h1Element = document.querySelector('h1');
      let usedResponses = []; // Keep track of used responses
      h1Element.addEventListener('mouseover', () => {
        if (usedResponses.length === cannedResponses.length) {
          usedResponses = []; // Reset if all responses have been shown
        }
        let availableResponses = cannedResponses.filter(response => !usedResponses.includes(response));
        const randomIndex = Math.floor(Math.random() * availableResponses.length);
        const selectedResponse = availableResponses[randomIndex];
        h1Element.textContent = selectedResponse; // Change the text
        usedResponses.push(selectedResponse); // Mark as used
      });
      h1Element.addEventListener('mouseout', () => {
        h1Element.textContent = "We are tired."; // Restore original text
      });
    </script>
