    const h1Element = document.querySelector('h1');
    let usedResponses = [];
    const originalText = "We are tired.";
    const intervalTime = 3000;
    let showingOriginal = true;
    function changeResponse() {
        if (showingOriginal) {
            if (usedResponses.length === cannedResponses.length) {
                usedResponses = [];
            }
            let availableResponses = cannedResponses.filter(response => !usedResponses.includes(response));
            if (availableResponses.length === 0) {
                h1Element.textContent = "No more responses available!";
                return;
            }
            const randomIndex = Math.floor(Math.random() * availableResponses.length);
            const selectedResponse = availableResponses[randomIndex];
            h1Element.classList.add('fade-out');
            h1Element.classList.remove('response');
            setTimeout(() => {
                h1Element.textContent = selectedResponse;
                h1Element.classList.add('response');
                h1Element.classList.remove('fade-out');
                h1Element.classList.add('fade-in');
                usedResponses.push(selectedResponse);
                setTimeout(() => {
                    h1Element.classList.remove('fade-in');
                }, 300);
                showingOriginal = false;
            }, 300);
        } else {
            h1Element.classList.add('fade-out');
            h1Element.classList.remove('response');
            setTimeout(() => {
                h1Element.textContent = originalText;
                h1Element.classList.remove('fade-out');
                h1Element.classList.remove('response');
                h1Element.classList.add('fade-in');
                setTimeout(() => {
                    h1Element.classList.remove('fade-in');
                }, 300);
                showingOriginal = true;
            }, 300);
        }
    }
    setInterval(changeResponse, intervalTime);
